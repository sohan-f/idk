enable-module-update = true # set this to false if you do not want to receive updates for the module
parallel-jobs = 1

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
enable-update-checks = true
exclusive-patches = true
included-patches = """\
  'AI channel filter' \
  'Add to queue' \
  'Ambient mode' \
  'Bypass image region restrictions' \
  'Bypass link redirects' \
  'Captions' \
  'Channel search' \
  'Channel whitelist' \
  'Check watch history domain name resolution' \
  'Copy text' \
  'Copy video link' \
  'DeArrow' \
  'Disable DRC audio' \
  'Disable QUIC protocol' \
  'Disable Shorts resuming on startup' \
  'Disable auto feed refresh' \
  'Disable continue watching prompt' \
  'Disable double tap actions' \
  'Disable fullscreen gestures' \
  'Disable player popup panels' \
  'Disable playlist autoplay' \
  'Disable rolling number animations' \
  'Disable scrolling speed limit' \
  'Disable sign in to TV popup' \
  'Disable video codecs' \
  'Double tap to seek' \
  'Downloads' \
  'Exit fullscreen mode' \
  'Force fullscreen landscape' \
  'Force original audio' \
  'Force system font' \
  'Fullscreen video scale' \
  'GmsCore support' \
  'Hide Shorts components' \
  'Hide ads' \
  'Hide autoplay preview' \
  'Hide end screen cards' \
  'Hide end screen suggested video' \
  'Hide info cards' \
  'Hide layout components' \
  'Hide player flyout menu components' \
  'Hide player overlay buttons' \
  'Hide related video overlay' \
  'Hide related videos' \
  'Hide status bar' \
  'Hide timestamp' \
  'Hide video action buttons' \
  'Loop video' \
  'Media notification controls' \
  'Miniplayer' \
  'Mute button' \
  'Navigation bar' \
  'Open Shorts in regular player' \
  'Open channel of live avatar' \
  'Open links externally' \
  'Open system share sheet' \
  'Open videos fullscreen' \
  'Override YouTube Music buttons' \
  'Picture-in-picture button' \
  'Play all' \
  'Playback buffer' \
  'Playback in feeds' \
  'Playback speed' \
  'Player icon style' \
  'PoToken provider' \
  'Reload video' \
  'Remember live stream playback position' \
  'Remove background playback restrictions' \
  'Remove viewer discretion dialog' \
  'Restore original titles' \
  'Return YouTube Dislike' \
  'Sanitize sharing links' \
  'Save to Watch later' \
  'Seekbar' \
  'Settings menu filter' \
  'Shorts autoplay' \
  'Shorts icon style' \
  'Skip silence' \
  'SponsorBlock' \
  'Spoof app version' \
  'Spoof device dimensions' \
  'Spoof video streams' \
  'Swipe controls' \
  'Theme' \
  'Video quality' \
  'Voice over translation' \
  'Wide search bar' \
  """
patcher-args = """\
  -e 'Theme' \
  -OdarkThemeColor='#290025' \
  -OlightThemeColor='#FCCFF3' \
  """

[Music-Morphe]
enabled = false
app-name = "Music"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "both"
arch = "both"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
enable-update-checks = true

